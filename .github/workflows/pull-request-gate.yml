name: Pull request gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    name: Test, typecheck, and build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build:main
      - run: npm run build:renderer
      - run: npm run smoke:electron-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-by-layer
          path: coverage/coverage-by-layer.json
          if-no-files-found: warn
